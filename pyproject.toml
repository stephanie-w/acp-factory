[project]
name = "acp-factory"
version = "0.1.0"
description = "ACP-driven automated coding task runner with sequential verification checks and self-healing feedback loops, powered by acpterm."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "acpterm",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.2",
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "ty>=0.0.1a0",
]

[tool.uv.sources]
acpterm = { git = "https://github.com/stephanie-w/acpterm.git", rev = "3fec31f97f673ac5e8d0332d3e9ed7c658ae28b6" }

[build-system]
requires = ["uv_build>=0.9.0,<0.12"]
build-backend = "uv_build"

[project.scripts]
acp-factory = "acp_factory.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [
    "demos",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pytest_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    "__pypackages__",
    "build",
    "dist",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "YTT", # flake8-2020
    "RUF", # ruff-specific rules
    "S",   # flake-bandit
    "ANN",
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "RUF012", # mutable class defaults
    "ANN401",
]

unfixable = [
    "F401",  # unused import
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["S", "ANN"]

#[tool.ruff.lint.isort]
#known-first-party = ["acpterm"]
#lines-after-imports = 2
#combine-as-imports = true
#force-sort-within-sections = true
#force-wrap-aliases = true
#order-by-type = false

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
exclude = ["demos"]

[tool.ty.rules]
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
redundant-cast = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
