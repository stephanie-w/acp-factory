# .factory/config.toml — Multi-stage acp-factory configuration
version = "1"

[agent]
name = "opencode"
timeout = 600

[retry]
max_attempts = 3
keep_worktree_on_failure = true

[stages.triage]
agent = "opencode"
mode = "plan"
read_only = true
persona = "personas/triage.md"
skills = ["issue-triage"]
prompt = "prompts/TRIAGE.md"
checks = ["validate-triage"]

[stages.spec]
agent = "opencode"
mode = "plan"
read_only = true
persona = "personas/architect.md"
skills = ["spec-writer"]
prompt = "prompts/SPEC.md"
checks = ["validate-spec"]

[stages.build]
agent = "opencode"
read_only = false
pre = ["uv sync --frozen"]
persona = "personas/implementer.md"
skills = ["tdd-builder"]
prompt = "prompts/BUILD.md"
checks = ["lint", "test"]

[stages.review]
agent = "opencode"
read_only = true
persona = "personas/reviewer.md"
skills = ["code-reviewer", "security-auditor"]
prompt = "prompts/REVIEW.md"
checks = ["validate-review"]

[checks.validate-triage]
command = "uv run \"$FACTORY_BUNDLED_SKILLS_DIR/issue-triage/scripts/validate_triage.py\" \"$FACTORY_RESPONSE_FILE\""

[checks.validate-spec]
command = "uv run \"$FACTORY_BUNDLED_SKILLS_DIR/spec-writer/scripts/validate_spec.py\" \"$FACTORY_RESPONSE_FILE\""

[checks.validate-review]
command = "uv run \"$FACTORY_BUNDLED_SKILLS_DIR/code-reviewer/scripts/validate_review.py\" \"$FACTORY_RESPONSE_FILE\""

[checks.validate-security]
command = "uv run \"$FACTORY_BUNDLED_SKILLS_DIR/security-auditor/scripts/validate_security.py\" \"$FACTORY_RESPONSE_FILE\""

[checks.lint]
command = "git diff --name-only --diff-filter=ACMR main -- '*.py' | xargs -r uv run --frozen ruff check"

[checks.test]
command = "uv run --frozen pytest"

[checks.review]
persona = "personas/reviewer.md"
skills = ["code-reviewer"]
prompt = "prompts/REVIEW.md"

[checks.security]
persona = "personas/security.md"
skills = ["security-auditor"]
prompt = "prompts/SECURITY.md"

