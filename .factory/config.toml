# .factory/config.toml — Multi-stage acp-factory configuration
version = "1"

[agent]
name = "opencode"
timeout = 600

[retry]
max_attempts = 3
keep_worktree_on_failure = true

[stages.triage]
agent = "opencode"
mode = "plan"
model = "deepseek/deepseek-flash"
read_only = true
persona = "agents/triage.agent.md"
skills = ["issue-triage"]
prompt = "prompts/triage.md"
checks = ["validate-triage"]
thought_max_chars = 100

[stages.spec]
agent = "agy"
mode = "plan"
model = "gemini-4-neon"
thought_level = "medium"
read_only = true
pre = ["apm install --frozen", "apm audit --ci"]
persona = "agents/architect.agent.md"
skills = ["spec-writer"]
prompt = "prompts/spec.md"
checks = ["validate-spec"]

[stages.build]
agent = "opencode"
model = "deepseek/deepseek-flash"
read_only = false
pre = ["uv sync --frozen", "uv run --frozen ruff format", "uv run --frozen ruff check", "uv run --frozen ty check", "apm install --frozen", "apm audit --ci"]
persona = "agents/implementer.agent.md"
skills = ["tdd-builder"]
prompt = "prompts/build.md"
checks = ["lint", "test"]
thought_max_chars = 100

[stages.review]
agent = "opencode"
model = "deepseek/deepseek-v4-pro"
read_only = true
persona = "agents/reviewer.agent.md"
skills = ["code-reviewer", "security-auditor"]
prompt = "prompts/review.md"
checks = ["validate-review", "validate-security"]
thought_max_chars = 100

[stages.retro]
agent = "opencode"
mode = "plan"
model = "deepseek/deepseek-v4-pro"
read_only = true
persona = "agents/architect.agent.md"
skills = ["retro"]
prompt = "prompts/retro.md"
checks = []

# Built-in Refactoring Flow (`flow:refactor`) stages
[stages.refactor-plan]
agent = "agy"
mode = "plan"
model = "gemini-4-neon"
thought_level = "medium"
read_only = true
revision_brief = true
pre = ["apm install --frozen", "apm audit --ci"]
persona = "agents/architect.agent.md"
skills = ["refactor-planner"]
prompt = "prompts/refactor-plan.md"
checks = ["validate-refactor-plan"]

[stages.refactor-apply]
agent = "opencode"
model = "deepseek/deepseek-flash"
read_only = false
worktree = true
pre = ["uv sync --frozen", "uv run --frozen ruff format", "uv run --frozen ruff check", "uv run --frozen ty check", "apm install --frozen", "apm audit --ci"]
persona = "agents/implementer.agent.md"
skills = ["refactor-builder"]
prompt = "prompts/refactor-apply.md"
checks = ["lint", "test"]
thought_max_chars = 100

[stages.refactor-review]
agent = "opencode"
model = "deepseek/deepseek-v4-pro"
read_only = true
worktree = true
require_clean_worktree = true
delta_review = true
inject_prior_notes_from = "refactor-apply"
persona = "agents/reviewer.agent.md"
skills = ["refactor-reviewer"]
prompt = "prompts/refactor-review.md"
checks = ["validate-review"]
thought_max_chars = 100

[checks.validate-triage]
command = "uv run --frozen python \"$FACTORY_SKILLS_DIR/issue-triage/scripts/validate_triage.py\" \"$FACTORY_RESPONSE_FILE\""

[checks.validate-spec]
command = "uv run --frozen python \"$FACTORY_SKILLS_DIR/spec-writer/scripts/validate_spec.py\" \"$FACTORY_RESPONSE_FILE\""

[checks.validate-refactor-plan]
command = "uv run --frozen python \"$FACTORY_SKILLS_DIR/refactor-planner/scripts/validate_refactor_plan.py\" \"$FACTORY_RESPONSE_FILE\""

[checks.validate-review]
command = "uv run --frozen python \"$FACTORY_SKILLS_DIR/code-reviewer/scripts/validate_review.py\" \"$FACTORY_RESPONSE_FILE\""

[checks.validate-security]
command = "uv run --frozen python \"$FACTORY_SKILLS_DIR/security-auditor/scripts/validate_security.py\" \"$FACTORY_RESPONSE_FILE\""

[checks.lint]
command = "git diff --name-only --diff-filter=ACMR main -- '*.py' | xargs -r uv run --frozen ruff check"

[checks.test]
command = "uv run --frozen pytest -m 'not slow'"

[checks.review]
persona = "agents/reviewer.agent.md"
skills = ["code-reviewer"]
prompt = "prompts/review.md"

[checks.security]
persona = "agents/security.agent.md"
skills = ["security-auditor"]
prompt = "prompts/security.md"

[budget]
max_tokens_per_run = 200000
max_cost_usd = 2.00
max_turns = 3
